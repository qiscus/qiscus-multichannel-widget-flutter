name: qiscus_multichannel_widget
description: Omnichannel Platform to Increase Sales and Customer Loyalty.
version: 1.4.0
homepage: https://www.qiscus.com/en

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=2.10.0"

dependencies:
  flutter:
    sdk: flutter
  qiscus_chat_sdk: ^2.1.1
  freezed_annotation: ^2.0.3
  grouped_list: ^6.0.0
  http: ^1.1.0
  flutter_riverpod: ^2.1.3
  date_format: ^2.0.5
  url_launcher: ^6.1.6
  json_annotation: ^4.5.0
  cached_network_image: ^3.2.1
  file_picker: ^8.1.2
  collection: ^1.16.0
  riverpod: ^2.1.3
  async: ^2.10.0
  riverpod_annotation: ^2.1.5
  flutter_secure_storage_x: ^10.1.0
  # Pin transitif — JANGAN DIHAPUS tanpa membaca alasannya.
  # flutter_secure_storage_x 10.2.x menarik
  # flutter_secure_storage_x_platform_interface dengan caret ^1.4.1, tapi sejak
  # 1.4.2 (patch bump, 22 Des 2025) paket itu memakai method channel
  # `plugins.dr1009.com/flutter_secure_storage` sementara implementasi native
  # 10.x-11.x masih mendaftarkan `plugins.it_nomads.com/flutter_secure_storage`
  # (rename domain di sisi native baru ikut di flutter_secure_storage_x 12.0.0).
  # Akibatnya `read()` melempar MissingPluginException dan app crash saat
  # membuka chat room (kasus client Viberlink, 2026-09 v1.3.6). 1.4.1 adalah
  # versi terakhir yang masih selaras dengan native 10.x/11.x.
  # Catatan: ini harus dependency biasa (bukan dependency_overrides) supaya
  # batasnya ikut terbawa ke resolusi app konsumen. Naikkan pin ini hanya
  # bareng kenaikan flutter_secure_storage_x ke >= 12.
  flutter_secure_storage_x_platform_interface: ">=1.4.1 <1.4.2"
  # Share location (map picker + GPS). Rentang versi sengaja lebar supaya
  # app konsumen dengan Flutter lebih lama (flutter_map 7 = Flutter >=3.10)
  # tetap bisa resolve; flutter_map 8 butuh Flutter >=3.27.
  flutter_map: ">=7.0.2 <9.0.0"
  latlong2: ">=0.9.1 <0.11.0"
  geolocator: ">=13.0.0 <15.0.0"
  geocoding: ">=3.0.0 <5.0.0"

dev_dependencies:
  # flutter_test:
  #   sdk: flutter
  flutter_lints: ^4.0.0
  freezed: ^2.0.3
  json_serializable: ^6.1.6
  build_runner: ^2.1.7
  riverpod_generator: ^2.3.2

# dependency_overrides:
#   qiscus_chat_sdk:
#     path: ../qiscus-chat-sdk-flutter

flutter:
  assets:
    - lib/src/assets/
