name: qiscus_multichannel_widget
description: Omnichannel Platform to Increase Sales and Customer Loyalty.
version: 1.5.1
homepage: https://www.qiscus.com/en

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=2.10.0"

dependencies:
  flutter:
    sdk: flutter
  qiscus_chat_sdk: ^2.1.1
  freezed_annotation: ^2.0.3
  grouped_list: ^6.0.0
  http: ^1.1.0
  flutter_riverpod: ^2.1.3
  date_format: ^2.0.5
  url_launcher: ^6.1.6
  json_annotation: ^4.5.0
  cached_network_image: ^3.2.1
  file_picker: ^8.1.2
  collection: ^1.16.0
  riverpod: ^2.1.3
  async: ^2.10.0
  riverpod_annotation: ^2.1.5
  # Pakai flutter_secure_storage upstream (bukan fork flutter_secure_storage_x):
  # keduanya memakai package Android `com.it_nomads.fluttersecurestorage` dan
  # channel yang sama, jadi host app yang memakai upstream gagal build (D8
  # duplicate class) bila widget memakai fork (kasus MTI #26050). Batas atas <11
  # karena `AndroidOptions.sharedPreferencesName` (lihat
  # shared_preference_provider.dart) dihapus di 11.x; host app di 11.x belum
  # didukung sampai provider dipindah ke `storageNamespace`.
  flutter_secure_storage: ">=9.2.4 <11.0.0"
  # Share location (map picker + GPS). Rentang versi sengaja lebar supaya
  # app konsumen dengan Flutter lebih lama (flutter_map 7 = Flutter >=3.10)
  # tetap bisa resolve; flutter_map 8 butuh Flutter >=3.27.
  flutter_map: ">=7.0.2 <9.0.0"
  latlong2: ">=0.9.1 <0.11.0"
  geolocator: ">=13.0.0 <15.0.0"
  geocoding: ">=3.0.0 <5.0.0"

dev_dependencies:
  # flutter_test:
  #   sdk: flutter
  flutter_lints: ^4.0.0
  freezed: ^2.0.3
  json_serializable: ^6.1.6
  build_runner: ^2.1.7
  riverpod_generator: ^2.3.2

# dependency_overrides:
#   qiscus_chat_sdk:
#     path: ../qiscus-chat-sdk-flutter

flutter:
  assets:
    - lib/src/assets/
